<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍼 Baby Monitor - Canlı İzleme</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            align-items: start;
        }
        
        .video-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .video-container {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .video-stream {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .video-overlay {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9em;
        }
        
        .status-panel {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .status-panel h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: #f8f9ff;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .status-value {
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 15px;
        }
        
        .status-normal { background: #d4edda; color: #155724; }
        .status-warning { background: #fff3cd; color: #856404; }
        .status-alert { background: #f8d7da; color: #721c24; }
        
        .controls {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button.motion-off {
            background: linear-gradient(45deg, #6c757d, #495057);
            opacity: 0.7;
        }
        
        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            z-index: 1000;
        }
        
        .connected { background: #28a745; }
        .disconnected { background: #dc3545; }
        
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2em;
            }
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Hareket bildirimi */
        .motion-alert {
            position: fixed;
            top: 80px;
            right: 20px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            color: white;
            padding: 20px 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.4);
            z-index: 1001;
            font-weight: bold;
            font-size: 1.1em;
            display: none;
            animation: slideIn 0.5s ease;
        }

        .motion-alert.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .motion-alert-icon {
            font-size: 2em;
            display: inline-block;
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍼 Baby Monitor</h1>
            <p>Canlı İzleme Sistemi</p>
        </div>
        
        <div class="connection-status connected" id="connectionStatus">
            🟢 Bağlı
        </div>

        <div class="motion-alert" id="motionAlert">
            <span class="motion-alert-icon">🚨</span>
            <span id="motionAlertText">Hareket Algılandı!</span>
        </div>

        <div class="main-grid">
            <div class="video-section">
                <div class="video-container">
                    <img src="/video_feed" class="video-stream" alt="Canlı Video" id="videoStream">
                    <div class="video-overlay" id="videoOverlay">
                        Canlı Yayın
                    </div>
                </div>
                
                <div class="controls">
                    <button onclick="refreshStream()">🔄 Yenile</button>
                    <button onclick="toggleFullscreen()">🖼️ Tam Ekran</button>
                </div>
                <div class="controls">
                    <button onclick="toggleMotionDetection()" id="motionToggleBtn">🚨 Hareket Algılama</button>
                    <button onclick="toggleNightVision()" id="nightVisionBtn">🌙 Gece Görüşü</button>
                </div>

                <div style="margin-top: 20px; padding: 15px; background: white; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
                    <h3 style="margin-top: 0; color: #667eea;">🎵 Sakinleştirici Sesler</h3>
                    <select id="soundSelect" style="width: 100%; padding: 10px; border-radius: 5px; border: 2px solid #667eea; margin-bottom: 10px;">
                        <option value="">Ses Seçin...</option>
                        <option value="whitenoise">🌊 Beyaz Gürültü</option>
                        <option value="pinknoise">💗 Pembe Gürültü</option>
                        <option value="shush">🤫 Pış Pış</option>
                        <option value="heartbeat">💓 Kalp Atışı</option>
                        <option value="rain">🌧️ Yağmur Sesi</option>
                        <option value="ocean">🌊 Okyanus Dalgaları</option>
                    </select>
                    <div class="controls">
                        <button onclick="playSoothingSound()" id="playBtn">▶️ Çal</button>
                        <button onclick="stopSoothingSound()" id="stopBtn">⏹️ Durdur</button>
                    </div>
                    <div style="margin-top: 10px;">
                        <label style="display: block; margin-bottom: 5px;">🔊 Ses Seviyesi:</label>
                        <input type="range" id="volumeSlider" min="0" max="100" value="50" style="width: 100%;" oninput="updateVolume(this.value)">
                        <span id="volumeLabel" style="display: block; text-align: center; margin-top: 5px;">50%</span>
                    </div>
                </div>
            </div>
            
            <div class="status-panel">
                <h2>📊 Durum Bilgileri</h2>
                
                <div class="status-item">
                    <span>🎥 Kamera:</span>
                    <span class="status-value status-normal" id="cameraStatus">Aktif</span>
                </div>
                
                <div class="status-item">
                    <span>📊 FPS:</span>
                    <span class="status-value status-normal" id="fpsStatus">-- fps</span>
                </div>
                
                <div class="status-item">
                    <span>👥 İzleyici:</span>
                    <span class="status-value" id="clientCount">--</span>
                </div>
                
                <div class="status-item">
                    <span>⏰ Son Güncelleme:</span>
                    <span class="status-value" id="lastUpdate">--:--:--</span>
                </div>

                <div class="status-item">
                    <span>🏃 Hareket:</span>
                    <span class="status-value status-normal" id="motionStatus">Normal</span>
                </div>

                <!-- İleride kullanılabilir (şimdilik comment)
                
                <div class="status-item">
                    <span>🌡️ Sıcaklık:</span>
                    <span class="status-value" id="temperature">--°C</span>
                </div>
                
                <div class="status-item">
                    <span>💧 Nem:</span>
                    <span class="status-value" id="humidity">--%</span>
                </div>
                
                <div class="status-item">
                    <span>🔊 Ses:</span>
                    <span class="status-value" id="soundLevel">-- dB</span>
                </div>
                -->
            </div>
        </div>
    </div>

    <script>
        // Socket.IO bağlantısı
        const socket = io();
        let isConnected = false;
        
        // Bağlantı durumu
        socket.on('connect', function() {
            isConnected = true;
            updateConnectionStatus(true);
            console.log('✅ Sunucuya bağlandı');
        });
        
        socket.on('disconnect', function() {
            isConnected = false;
            updateConnectionStatus(false);
            console.log('❌ Sunucudan ayrıldı');
        });
        
        // Durum güncellemeleri
        socket.on('status_update', function(data) {
            updateStatus(data);
        });

        // Hareket bildirimi
        socket.on('motion_alert', function(data) {
            showMotionAlert(data);
        });
        
        function updateConnectionStatus(connected) {
            const statusEl = document.getElementById('connectionStatus');
            if (connected) {
                statusEl.className = 'connection-status connected';
                statusEl.innerHTML = '🟢 Bağlı';
            } else {
                statusEl.className = 'connection-status disconnected';
                statusEl.innerHTML = '🔴 Bağlantı Yok';
            }
        }
        
        function updateStatus(data) {
            // FPS bilgisi
            if (data.camera_fps !== undefined) {
                document.getElementById('fpsStatus').textContent = data.camera_fps + ' fps';
            }

            // Hareket tespiti
            const motionEl = document.getElementById('motionStatus');
            if (data.motion_detected) {
                motionEl.textContent = 'Hareket Var!';
                motionEl.className = 'status-value status-alert pulse';
            } else {
                motionEl.textContent = 'Normal';
                motionEl.className = 'status-value status-normal';
            }

            // Hareket algılama butonu durumu
            if (data.motion_enabled !== undefined) {
                updateMotionButton(data.motion_enabled);
            }

            // Gece görüşü butonu durumu
            if (data.night_vision_enabled !== undefined) {
                updateNightVisionButton(data.night_vision_enabled);
            }
            
            // İleride sıcaklık eklenebilir
            // const tempEl = document.getElementById('temperature');
            // if (data.temperature) {
            //     tempEl.textContent = data.temperature + '°C';
            //     if (data.temperature < 18 || data.temperature > 26) {
            //         tempEl.className = 'status-value status-warning';
            //     } else {
            //         tempEl.className = 'status-value status-normal';
            //     }
            // }
            
            // İleride nem eklenebilir
            // const humidityEl = document.getElementById('humidity');
            // if (data.humidity) {
            //     humidityEl.textContent = data.humidity + '%';
            //     if (data.humidity > 70) {
            //         humidityEl.className = 'status-value status-warning';
            //     } else {
            //         humidityEl.className = 'status-value status-normal';
            //     }
            // }
            
            // İleride ses seviyesi eklenebilir
            // const soundEl = document.getElementById('soundLevel');
            // if (data.sound_level !== undefined) {
            //     soundEl.textContent = data.sound_level + ' dB';
            //     if (data.sound_level > 60) {
            //         soundEl.className = 'status-value status-alert';
            //     } else {
            //         soundEl.className = 'status-value status-normal';
            //     }
            // }
            
            // Son güncelleme zamanı
            document.getElementById('lastUpdate').textContent = data.timestamp || '--:--:--';
        }
        
        // İstemci sayısı güncellemesi
        socket.on('status', function(data) {
            if (data.connected_clients !== undefined) {
                document.getElementById('clientCount').textContent = data.connected_clients;
            }
        });

        // Hareket bildirimi göster
        let motionAlertTimeout;
        function showMotionAlert(data) {
            const alertEl = document.getElementById('motionAlert');
            const textEl = document.getElementById('motionAlertText');

            // Bildirim metnini güncelle
            textEl.textContent = `Hareket Algılandı! (${data.motion_percentage}%)`;

            // Bildirimi göster
            alertEl.classList.add('show');

            // Ses çal (tarayıcı izin verirse)
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = 800;
                oscillator.type = 'sine';

                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            } catch (e) {
                console.log('Ses çalınamadı:', e);
            }

            // Önceki timeout'u temizle
            if (motionAlertTimeout) {
                clearTimeout(motionAlertTimeout);
            }

            // 5 saniye sonra gizle
            motionAlertTimeout = setTimeout(function() {
                alertEl.classList.remove('show');
            }, 5000);

            console.log('🚨 Hareket bildirimi:', data);
        }
        
        function refreshStream() {
            const videoEl = document.getElementById('videoStream');
            const currentSrc = videoEl.src;
            videoEl.src = '';
            setTimeout(() => {
                videoEl.src = currentSrc + '?t=' + new Date().getTime();
            }, 100);
        }
        
        function toggleFullscreen() {
            const videoEl = document.getElementById('videoStream');
            if (videoEl.requestFullscreen) {
                videoEl.requestFullscreen();
            } else if (videoEl.webkitRequestFullscreen) {
                videoEl.webkitRequestFullscreen();
            } else if (videoEl.msRequestFullscreen) {
                videoEl.msRequestFullscreen();
            }
        }

        // Hareket algılamayı aç/kapa
        function toggleMotionDetection() {
            fetch('/api/motion/toggle', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    updateMotionButton(data.motion_enabled);
                    console.log('Hareket algılama:', data.motion_enabled ? 'AÇIK' : 'KAPALI');
                }
            })
            .catch(error => console.error('Hata:', error));
        }

        // Hareket algılama butonunu güncelle
        function updateMotionButton(enabled) {
            const btn = document.getElementById('motionToggleBtn');
            if (enabled) {
                btn.textContent = '🚨 Hareket: AÇIK';
                btn.classList.remove('motion-off');
            } else {
                btn.textContent = '🚫 Hareket: KAPALI';
                btn.classList.add('motion-off');
            }
        }

        // Gece görüşünü aç/kapa
        function toggleNightVision() {
            fetch('/api/nightvision/toggle', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    updateNightVisionButton(data.night_vision_enabled);
                    console.log('Gece görüşü:', data.night_vision_enabled ? 'AÇIK' : 'KAPALI');
                }
            })
            .catch(error => console.error('Hata:', error));
        }

        // Gece görüşü butonunu güncelle
        function updateNightVisionButton(enabled) {
            const btn = document.getElementById('nightVisionBtn');
            if (enabled) {
                btn.textContent = '🌙 Gece Görüşü: AÇIK';
                btn.classList.remove('motion-off');
            } else {
                btn.textContent = '🌑 Gece Görüşü: KAPALI';
                btn.classList.add('motion-off');
            }
        }

        // Sakinleştirici sesler için Audio API
        let audioContext = null;
        let soundSource = null;
        let gainNode = null;
        let currentSound = null;

        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                gainNode = audioContext.createGain();
                gainNode.connect(audioContext.destination);
                gainNode.gain.value = 0.5; // 50% volume
            }
        }

        function generateWhiteNoise() {
            const bufferSize = 2 * audioContext.sampleRate;
            const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
            const whiteNoise = audioContext.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            whiteNoise.loop = true;
            return whiteNoise;
        }

        function generatePinkNoise() {
            const bufferSize = 2 * audioContext.sampleRate;
            const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + white * 0.0555179;
                b1 = 0.99332 * b1 + white * 0.0750759;
                b2 = 0.96900 * b2 + white * 0.1538520;
                b3 = 0.86650 * b3 + white * 0.3104856;
                b4 = 0.55000 * b4 + white * 0.5329522;
                b5 = -0.7616 * b5 - white * 0.0168980;
                output[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
                output[i] *= 0.11;
                b6 = white * 0.115926;
            }
            const pinkNoise = audioContext.createBufferSource();
            pinkNoise.buffer = noiseBuffer;
            pinkNoise.loop = true;
            return pinkNoise;
        }

        function generateShush() {
            const oscillator = audioContext.createOscillator();
            const lfo = audioContext.createOscillator();
            const lfoGain = audioContext.createGain();

            lfo.frequency.value = 3; // 3 Hz modulation
            lfoGain.gain.value = 200;
            lfo.connect(lfoGain);
            lfoGain.connect(oscillator.frequency);

            oscillator.type = 'sawtooth';
            oscillator.frequency.value = 2000;
            lfo.start();

            return { main: oscillator, lfo: lfo };
        }

        function generateHeartbeat() {
            // Kalp atışı için beat pattern oluştur
            const beats = [];
            const bpm = 70; // 70 beats per minute
            const beatInterval = 60 / bpm;

            for (let i = 0; i < 10; i++) {
                const oscillator = audioContext.createOscillator();
                oscillator.type = 'sine';
                oscillator.frequency.value = 80;
                beats.push(oscillator);
            }
            return beats[0]; // Simplified
        }

        function generateRain() {
            // Yağmur sesi - beyaz gürültüye benzer ama daha filtered
            const whiteNoise = generateWhiteNoise();
            const filter = audioContext.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 1000;
            whiteNoise.connect(filter);
            filter.connect(gainNode);
            return { source: whiteNoise, useCustomConnection: true };
        }

        function generateOcean() {
            // Okyanus dalgası - düşük frekanslı modülasyon
            const oscillator = audioContext.createOscillator();
            const lfo = audioContext.createOscillator();
            const lfoGain = audioContext.createGain();

            lfo.frequency.value = 0.3; // Yavaş dalga
            lfoGain.gain.value = 100;
            lfo.connect(lfoGain);
            lfoGain.connect(oscillator.frequency);

            oscillator.type = 'sine';
            oscillator.frequency.value = 100;
            lfo.start();

            return { main: oscillator, lfo: lfo };
        }

        function playSoothingSound() {
            const soundType = document.getElementById('soundSelect').value;
            if (!soundType) {
                alert('Lütfen bir ses seçin');
                return;
            }

            stopSoothingSound(); // Önceki sesi durdur
            initAudioContext();

            currentSound = soundType;

            switch(soundType) {
                case 'whitenoise':
                    soundSource = generateWhiteNoise();
                    soundSource.connect(gainNode);
                    soundSource.start();
                    break;
                case 'pinknoise':
                    soundSource = generatePinkNoise();
                    soundSource.connect(gainNode);
                    soundSource.start();
                    break;
                case 'shush':
                    const shush = generateShush();
                    soundSource = shush.main;
                    soundSource.connect(gainNode);
                    soundSource.start();
                    break;
                case 'heartbeat':
                    soundSource = generateHeartbeat();
                    soundSource.connect(gainNode);
                    soundSource.start();
                    break;
                case 'rain':
                    const rain = generateRain();
                    soundSource = rain.source;
                    soundSource.start();
                    break;
                case 'ocean':
                    const ocean = generateOcean();
                    soundSource = ocean.main;
                    soundSource.connect(gainNode);
                    soundSource.start();
                    break;
            }

            console.log('🎵 Sakinleştirici ses çalıyor:', soundType);
        }

        function stopSoothingSound() {
            if (soundSource) {
                try {
                    soundSource.stop();
                } catch(e) {}
                soundSource = null;
                currentSound = null;
                console.log('⏹️ Ses durduruldu');
            }
        }

        function updateVolume(value) {
            if (gainNode) {
                gainNode.gain.value = value / 100;
            }
            document.getElementById('volumeLabel').textContent = value + '%';
        }

        // Sayfa yüklendiğinde durum bilgilerini al
        window.addEventListener('load', function() {
            socket.emit('request_status');

            // Hareket algılama durumunu al
            fetch('/api/motion/status')
                .then(response => response.json())
                .then(data => {
                    updateMotionButton(data.motion_enabled);
                });

            // Gece görüşü durumunu al
            fetch('/api/nightvision/status')
                .then(response => response.json())
                .then(data => {
                    updateNightVisionButton(data.night_vision_enabled);
                });
        });
        
        // Video stream hata durumu
        document.getElementById('videoStream').onerror = function() {
            console.log('Video stream hatası - yeniden bağlanıyor...');
            setTimeout(refreshStream, 2000);
        };
    </script>
</body>
</html>
